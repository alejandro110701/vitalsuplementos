name: Build for WordPress.com

# Builds the storefront and hands it to WordPress.com's GitHub Deployments.
#
# WordPress.com collects the build from an artifact that MUST be named `wpcom`
# — it looks for that name and nothing else. The artifact's contents are copied
# into whatever destination directory is configured under
# Settings -> GitHub Deployments on the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wpcom-${{ github.ref }}
  cancel-in-progress: true

env:
  # "./" rather than a fixed path: every asset URL becomes relative to the
  # document, so the same artifact works whether WordPress.com is configured to
  # deploy it to the site root or to a subdirectory. Changing that setting can
  # then never leave the site pointing at asset URLs that do not exist.
  # This is safe only because the app routes through the URL fragment — the
  # document path never changes, so relative URLs always resolve.
  #
  # Note the packshots live in public/packshots, not public/shop: deployed to
  # the root, a real /shop/ directory would shadow the WooCommerce shop page.
  BASE_PATH: ./

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Prices are baked in at build time, so a deploy always ships what
      # WooCommerce is charging. If the shop is unreachable the committed
      # woo.js is used and the build still succeeds — a stale price beats a
      # broken deploy.
      - name: Sync catalogue from WooCommerce
        run: npm run sync:woo || echo "shop unreachable — keeping the committed catalogue"

      - run: npm run build

      # Static hosting has no server-side router, so a deep link would 404.
      # This hands those paths back to the client router.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # The name is the contract with WordPress.com. Do not rename it.
      # include-hidden-files is kept because upload-artifact silently drops
      # dotfiles, and a build that gains one should not lose it quietly.
      # (The SPA no longer ships an .htaccess: Atomic ignores mod_rewrite
      # overrides, so the client router uses the URL fragment instead.)
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpcom
          path: |
            dist
            wordpress
          include-hidden-files: true
          if-no-files-found: error
          # WordPress.com collects the artifact and then has no further use for
          # it, but GitHub keeps artifacts for 90 days by default and bills for
          # the storage. Their GitHub Deployments guide asks for this on every
          # workflow.
          retention-days: 1
